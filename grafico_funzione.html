<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grafico di una funzione</title>
<style>
:root{--blu:#1a5fa8;--grigio:#f2f4f7;--bordo:#d5dae1;--rosso:#c0392b}
*{box-sizing:border-box}
body{margin:0;padding:16px;font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--grigio);color:#222}
.riga{display:flex;align-items:center;gap:8px;max-width:900px;margin:0 auto 6px}
.riga span{font-family:Consolas,"Courier New",monospace;font-size:1.2rem;color:var(--blu);font-weight:bold;white-space:nowrap}
#espr{flex:1;min-width:0;padding:8px 10px;font-family:Consolas,"Courier New",monospace;font-size:1.2rem;border:1px solid var(--bordo);border-radius:8px}
#espr:focus{outline:2px solid var(--blu);outline-offset:-1px}
#espr.err{border-color:var(--rosso);background:#fdecea}
#msg{max-width:900px;margin:0 auto 8px;min-height:1.2em;font-size:.85rem;color:var(--rosso)}
#tela{display:block;width:100%;max-width:900px;height:calc(100vh - 110px);min-height:360px;margin:0 auto;background:#fff;border:1px solid var(--bordo);border-radius:10px;touch-action:none;cursor:grab}
</style>
</head>
<body>
<div class="riga">
  <span>f(x) =</span>
  <input id="espr" type="text" value="x^2 - 4" spellcheck="false" autocomplete="off">
</div>
<div id="msg"></div>
<canvas id="tela"></canvas>

<script>
"use strict";
// PARSER-START
const FUNZ = {
  sqrt: Math.sqrt, sin: Math.sin, sen: Math.sin, cos: Math.cos, tan: Math.tan, tg: Math.tan,
  arcsin: Math.asin, arccos: Math.acos, arctan: Math.atan, arctg: Math.atan,
  ln: Math.log, log: Math.log10, exp: Math.exp, abs: Math.abs
};
const COST = { pi: Math.PI, "π": Math.PI, e: Math.E };
const NOMI = [...Object.keys(FUNZ), ...Object.keys(COST), "x"].sort((p, q) => q.length - p.length);

function potenza(b, ex) {
  if (b < 0 && !Number.isInteger(ex)) {             // radici dispari di numeri negativi, es. x^(1/3)
    for (let q = 3; q <= 15; q += 2) {
      const pp = ex * q;
      if (Math.abs(pp - Math.round(pp)) < 1e-9) {
        const r = Math.pow(-b, ex);
        return Math.round(pp) % 2 === 0 ? r : -r;
      }
    }
    return NaN;
  }
  return Math.pow(b, ex);
}

function tokenizza(s) {
  s = s.replace(/,/g, ".").replace(/[·×]/g, "*").replace(/:/g, "/").replace(/[−–]/g, "-")
       .replace(/²/g, "^2").replace(/³/g, "^3").replace(/√/g, "sqrt");
  const t = [];
  let i = 0;
  while (i < s.length) {
    const ch = s[i];
    if (/\s/.test(ch)) { i++; continue; }
    if (/[0-9.]/.test(ch)) {
      const m = /^(\d+\.?\d*|\.\d+)/.exec(s.slice(i));
      if (!m) throw new Error("Numero non valido");
      t.push({ k: "num", v: parseFloat(m[0]) }); i += m[0].length; continue;
    }
    if ("+-*/^()|".includes(ch)) { t.push({ k: "op", v: ch }); i++; continue; }
    if (/[a-zA-Zπ]/.test(ch)) {
      const resto = s.slice(i).toLowerCase();
      const n = NOMI.find(m => resto.startsWith(m));
      if (!n) throw new Error("Simbolo sconosciuto: " + s.slice(i).match(/^[a-zA-Zπ]+/)[0]);
      t.push({ k: n in FUNZ ? "fun" : n in COST ? "cost" : "x", v: n }); i += n.length; continue;
    }
    throw new Error("Carattere non valido: " + ch);
  }
  return t;
}

function compila(src) {
  const t = tokenizza(src);
  if (!t.length) throw new Error("Scrivi una funzione");
  let p = 0;
  const op = v => p < t.length && t[p].k === "op" && t[p].v === v;
  const fattore = () => p < t.length && (t[p].k !== "op" || t[p].v === "(");
  function somma() {
    let f = prodotto();
    while (op("+") || op("-")) {
      const o = t[p++].v, g = prodotto(), a = f;
      f = o === "+" ? x => a(x) + g(x) : x => a(x) - g(x);
    }
    return f;
  }
  function prodotto() {
    let f = unario();
    for (;;) {
      if (op("*") || op("/")) {
        const o = t[p++].v, g = unario(), a = f;
        f = o === "*" ? x => a(x) * g(x) : x => a(x) / g(x);
      } else if (fattore()) { const g = pot(), a = f; f = x => a(x) * g(x); }   // 2x, 3(x+1)
      else break;
    }
    return f;
  }
  function unario() {
    if (op("-")) { p++; const g = unario(); return x => -g(x); }
    if (op("+")) { p++; return unario(); }
    return pot();
  }
  function pot() {
    const b = base();
    if (op("^")) { p++; const e = unario(); return x => potenza(b(x), e(x)); }
    return b;
  }
  function base() {
    if (p >= t.length) throw new Error("Espressione incompleta");
    const q = t[p];
    if (q.k === "num") { p++; return () => q.v; }
    if (q.k === "cost") { p++; const v = COST[q.v]; return () => v; }
    if (q.k === "x") { p++; return x => x; }
    if (q.k === "fun") {
      p++;
      const fn = FUNZ[q.v];
      let arg;
      if (op("(")) { p++; arg = somma(); if (!op(")")) throw new Error("Manca una parentesi )"); p++; }
      else { if (p >= t.length) throw new Error("Manca l'argomento di " + q.v); arg = pot(); }
      return x => fn(arg(x));
    }
    if (op("(")) { p++; const g = somma(); if (!op(")")) throw new Error("Manca una parentesi )"); p++; return g; }
    if (op("|")) { p++; const g = somma(); if (!op("|")) throw new Error("Manca la barra | di chiusura"); p++; return x => Math.abs(g(x)); }
    throw new Error("Simbolo inatteso: " + q.v);
  }
  const f = somma();
  if (p < t.length) {
    if (t[p].v === "|") throw new Error("Davanti a |...| scrivi il segno *, es. 2*|x|");
    if (t[p].v === ")") throw new Error("Parentesi ) in più");
    throw new Error("Simbolo inatteso: " + t[p].v);
  }
  return f;
}
// PARSER-END

const tela = document.getElementById("tela"), ctx = tela.getContext("2d");
const espr = document.getElementById("espr"), msg = document.getElementById("msg");
let W = 0, H = 0, dpr = 1, f = null;
const v = { cx: 0, cy: 0, s: 40 };                      // centro e pixel per unità

const X = x => W / 2 + (x - v.cx) * v.s;
const Y = y => H / 2 - (y - v.cy) * v.s;
const daX = px => v.cx + (px - W / 2) / v.s;
const val = x => { try { const y = f(x); return typeof y === "number" ? y : NaN; } catch (e) { return NaN; } };

function passo() {
  const raw = 60 / v.s, m = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / m;
  return (n < 1.5 ? 1 : n < 3.5 ? 2 : n < 7.5 ? 5 : 10) * m;
}
function etichetta(n, st) {
  const dec = Math.max(0, -Math.floor(Math.log10(st) + 1e-9));
  return n.toFixed(dec).replace(".", ",").replace("-", "−");
}

function disegna() {
  if (!W) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, W, H);
  const st = passo(), x0 = daX(0), x1 = daX(W), y0 = v.cy - H / 2 / v.s, y1 = v.cy + H / 2 / v.s;
  const ox = X(0), oy = Y(0);

  ctx.strokeStyle = "#e3e7ed"; ctx.lineWidth = 1; ctx.beginPath();
  for (let k = Math.ceil(x0 / st); k * st <= x1; k++) { const q = Math.round(X(k * st)) + .5; ctx.moveTo(q, 0); ctx.lineTo(q, H); }
  for (let k = Math.ceil(y0 / st); k * st <= y1; k++) { const q = Math.round(Y(k * st)) + .5; ctx.moveTo(0, q); ctx.lineTo(W, q); }
  ctx.stroke();

  ctx.strokeStyle = "#333"; ctx.fillStyle = "#333"; ctx.lineWidth = 1.3; ctx.beginPath();
  ctx.moveTo(0, oy); ctx.lineTo(W, oy); ctx.moveTo(ox, 0); ctx.lineTo(ox, H); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W, oy); ctx.lineTo(W - 10, oy - 4.5); ctx.lineTo(W - 10, oy + 4.5); ctx.fill();
  ctx.beginPath(); ctx.moveTo(ox, 0); ctx.lineTo(ox - 4.5, 10); ctx.lineTo(ox + 4.5, 10); ctx.fill();
  ctx.font = "italic 16px 'Times New Roman', serif";
  ctx.textAlign = "right"; ctx.textBaseline = "bottom"; ctx.fillText("x", W - 6, oy - 6);
  ctx.textAlign = "left"; ctx.textBaseline = "top"; ctx.fillText("y", ox + 8, 2);

  ctx.font = "12px 'Segoe UI', Arial, sans-serif"; ctx.fillStyle = "#555";
  const ly = Math.min(Math.max(oy, 0), H - 20) + 4;
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  for (let k = Math.ceil(x0 / st); k * st <= x1; k++) {
    const q = X(k * st);
    if (k !== 0 && q > 12 && q < W - 20) ctx.fillText(etichetta(k * st, st), q, ly);
  }
  const lx = Math.min(Math.max(ox, 30), W) - 6;
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  for (let k = Math.ceil(y0 / st); k * st <= y1; k++) {
    const q = Y(k * st);
    if (k !== 0 && q > 18 && q < H - 10) ctx.fillText(etichetta(k * st, st), lx, q);
  }
  ctx.textAlign = "right"; ctx.textBaseline = "top"; ctx.fillText("O", ox - 5, oy + 4);

  if (!f) return;
  ctx.strokeStyle = "#1a5fa8"; ctx.lineWidth = 2.5; ctx.lineJoin = "round"; ctx.beginPath();
  let aperto = false, pyP = 0, xP = 0, yP = 0;
  for (let px = 0; px <= W; px += 0.5) {
    const x = daX(px), y = val(x);
    if (!isFinite(y)) { aperto = false; continue; }
    const py = Y(y);
    if (aperto && Math.abs(py - pyP) > H) {               // asintoto verticale: non unire i rami
      const ym = val((x + xP) / 2);
      if (!(isFinite(ym) && ym >= Math.min(y, yP) && ym <= Math.max(y, yP))) aperto = false;
    }
    const c = Math.max(-1e4, Math.min(1e4, py));
    if (aperto) ctx.lineTo(px, c); else { ctx.moveTo(px, c); aperto = true; }
    pyP = py; xP = x; yP = y;
  }
  ctx.stroke();
}

function aggiorna() {
  try { f = compila(espr.value); msg.textContent = ""; espr.classList.remove("err"); }
  catch (e) { f = null; msg.textContent = e.message; espr.classList.add("err"); }
  disegna();
}

function ridimensiona() {
  const r = tela.getBoundingClientRect();
  dpr = window.devicePixelRatio || 1; W = r.width; H = r.height;
  tela.width = Math.round(W * dpr); tela.height = Math.round(H * dpr);
  if (v.s === 40) v.s = Math.min(W, H) / 20;
  disegna();
}

espr.addEventListener("input", aggiorna);

// zoom con la rotellina, spostamento trascinando
tela.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = tela.getBoundingClientRect(), px = ev.clientX - r.left, py = ev.clientY - r.top;
  const xm = daX(px), ym = v.cy - (py - H / 2) / v.s;
  v.s = Math.min(1e5, Math.max(0.01, v.s * Math.exp(-ev.deltaY * 0.0015)));
  v.cx = xm - (px - W / 2) / v.s; v.cy = ym + (py - H / 2) / v.s;
  disegna();
}, { passive: false });
let drag = null;
tela.addEventListener("pointerdown", ev => { tela.setPointerCapture(ev.pointerId); drag = { x: ev.clientX, y: ev.clientY }; tela.style.cursor = "grabbing"; });
tela.addEventListener("pointermove", ev => {
  if (!drag) return;
  v.cx -= (ev.clientX - drag.x) / v.s; v.cy += (ev.clientY - drag.y) / v.s;
  drag = { x: ev.clientX, y: ev.clientY }; disegna();
});
const fine = () => { drag = null; tela.style.cursor = "grab"; };
tela.addEventListener("pointerup", fine);
tela.addEventListener("pointercancel", fine);

new ResizeObserver(ridimensiona).observe(tela);
aggiorna();
</script>
</body>
</html>
